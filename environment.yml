name: denoising_av

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  # NumPy 1.26 is the conservative compatibility target for ObsPy 1.4 and
  # the SeisBench/PyTorch model stack used by this repository.
  - numpy>=1.26,<2
  - scipy>=1.11,<2
  - pandas>=2.0,<3
  - matplotlib>=3.8,<4
  - obspy>=1.4,<2
  - pyyaml>=6,<7
  - requests>=2.31,<3
  - pytorch>=2.2,<3
  - pip
  - pip:
      - seisbench>=0.11.5,<1

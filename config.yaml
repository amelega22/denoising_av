# Single source of truth for a run. Every run copies this (plus any CLI
# overrides) into outputs/<run_id>/config_used.yaml.

data:
  source: IRIS
  network: AV
  stations: [SSLS, SSLN, SSBA] # need to figure out how to skip station if no data is present
  primary_station: SSLS        # trace used for plots / SNR / catalog intervals
  location: ""
  channel: "BH*"               # what is requested from the server
  component: BHZ               # what is kept for processing

  # Analysis window. Start a bit early so STA/LTA has time to warm up
  # (see trigger.startup_seconds).
  start_time: "2025-11-01T00:02:00"
  stop_time: "2025-11-01T00:12:00"

  # Padding added on each side at download time, trimmed off after
  # filtering to remove taper/edge effects.
  edge_trim_seconds: 5

  # Raw waveforms + station inventory are cached here so reruns are
  # offline and identical. Relative paths are relative to this file.
  cache_dir: cache

filter:
  bandpass:            # used by script 01 (filter, then denoise)
    freqmin: 0.9
    freqmax: 8.0
    corners: 2
    zerophase: true
  highpass:            # used by script 02 (denoise, then filter)
    freq: 0.1
    corners: 2
    zerophase: true

denoise:
  pretrained: original         # seisbench DeepDenoiser weights

trigger:
  sta_seconds: 1.5
  lta_seconds: 15.0
  thr_on: 2.0
  thr_off: 1.0
  # Triggers earlier than this (seconds after trace start) are discarded.
  # Try to keep it >= lta_seconds so the LTA window is full.
  startup_seconds: 60
  # Number of distinct stations that must trigger together.
  # null = all stations in data.stations.
  coincidence_sum: 2

output:
  dir: outputs                 # results land in <dir>/<run_id>/
  compact_csv_floats: true     # 2 decimals / 2-digit sci notation, as in the original notebook

plot:
  spectrogram_window_seconds: 5
  spectrogram_overlap: 0.5
  spectrogram_ref: 1.0
  spectrogram_ylim: [0, 10]    # Hz
  colormap: viridis
  waveform_ylim: [-1.0e-5, 1.0e-5]
  waveform_yticks: [-5.0e-6, 0.0, 5.0e-6]
  explainer_event_idx: 1       # which filtered trigger to explain; null = biggest
  explainer_pad_before: 30     # s; should be > trigger.lta_seconds
  explainer_pad_after: 20
